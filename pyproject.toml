[project]
name = "baadhi-saathi"
version = "0.1.0"
description = "Flood Friend: a Strands agent that turns river and rain forecasts into plain Nepali advice for one household."
requires-python = ">=3.12"
dependencies = ["strands-agents>=1.62,<2", "boto3>=1.43"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
